<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shimmer animation -->
    <linearGradient id="shine" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="2s" repeatCount="indefinite"/>
    </linearGradient>

    <mask id="mask">
      <rect width="1200" height="300" fill="url(#shine)"/>
    </mask>
  </defs>

  <!-- Text -->
  <text x="50%" y="60%" text-anchor="middle"
        font-size="160"
        font-weight="900"
        font-family="Poppins, Montserrat, Arial Black, sans-serif"
        fill="url(#gold)"
        filter="url(#glow)">

    HUSTLE

    <!-- Blink -->
    <animate attributeName="opacity"
             values="0.7;1;0.7"
             dur="1.8s"
             repeatCount="indefinite"/>
  </text>

  <!-- Shimmer overlay -->
  <text x="50%" y="60%" text-anchor="middle"
        font-size="160"
        font-weight="900"
        font-family="Poppins, Montserrat, Arial Black, sans-serif"
        fill="white"
        mask="url(#mask)"
        opacity="0.8">

    HUSTLE
  </text>

</svg>
